<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">grimael / Statistique, Data Science et applications</title>
  <desc id="desc">Des données aux décisions : un flux relie les sources, les modèles et une visualisation. Une animation introductive de moins de cinq secondes accompagne le schéma.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; letter-spacing: 0; }
    .flow { stroke-dasharray: 10 110; animation: flow 4.4s linear both; }
    .trace { stroke-dasharray: 390; stroke-dashoffset: 0; animation: trace 2.5s ease .3s both; }
    .bar { transform-box: fill-box; transform-origin: center bottom; animation: grow 1.4s cubic-bezier(.2,.7,.2,1) both; }
    .bar-b { animation-delay: .2s; } .bar-c { animation-delay: .4s; }
    @keyframes flow { 0% { stroke-dashoffset: 0; opacity: 0; } 8% { opacity: 1; } 85% { opacity: 1; } 100% { stroke-dashoffset: -480; opacity: 0; } }
    @keyframes trace { from { stroke-dashoffset: 390; } to { stroke-dashoffset: 0; } }
    @keyframes grow { from { transform: scaleY(.15); } to { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; opacity: 0; } .trace, .bar { animation: none; } }
  </style>
  <defs><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#28343c" stroke-width=".6"/></pattern></defs>
  <rect width="1200" height="430" rx="8" fill="#0d1117"/>
  <rect x="620" y="24" width="556" height="360" fill="url(#grid)" opacity=".65"/>
  <g transform="translate(48 44)"><rect x="0" y="16" width="7" height="12" rx="1" fill="#5ed9eb"/><rect x="11" y="8" width="7" height="20" rx="1" fill="#f0f6fc"/><rect x="22" y="0" width="7" height="28" rx="1" fill="#89d5b0"/></g>
